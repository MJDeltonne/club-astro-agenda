<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Agenda du Club Astronomie MJC Douai</title>
  <link rel="stylesheet" href="./css/agenda.css">
  <script defer src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.20/index.global.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.20/locales/fr.global.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@fullcalendar/luxon3@6.1.20/index.global.min.js"></script>
  <script type="module" src="./js/agenda.js"></script>
</head>
<body>
  <main>
    <h1 class="visually-hidden">Agenda du Club Astronomie MJC Douai</h1>
    <fieldset id="categories" hidden><legend>Catégories affichées</legend></fieldset>
    <p id="demo" class="demo" hidden>Mode démonstration · Événements fictifs</p>
    <p id="status" role="status">Initialisation du calendrier…</p>
    <button id="retry" type="button" hidden>Réessayer</button>
    <section class="calendar-panel" aria-label="Calendrier des événements">
      <div id="calendar-controls" hidden>
        <div class="calendar-commands">
          <div class="calendar-views" role="group" aria-label="Vue du calendrier">
            <button id="view-dayGridMonth" type="button" aria-pressed="false">Mois</button>
            <button id="view-timeGridWeek" type="button" aria-pressed="false">Semaine</button>
            <button id="view-timeGridDay" type="button" aria-pressed="false">Jour</button>
            <button id="view-listUpcoming" type="button" aria-pressed="false">À venir</button>
          </div>
          <div class="agenda-actions">
            <button id="subscribe" type="button" hidden>S’abonner</button>
            <button id="print" type="button" hidden>Imprimer</button>
          </div>
        </div>
        <div class="calendar-navigation">
          <div class="calendar-period">
            <button id="previous-period" type="button" aria-label="Période précédente">‹</button>
            <h2 id="period-title" aria-live="polite"></h2>
            <button id="next-period" type="button" aria-label="Période suivante">›</button>
          </div>
          <button id="today" type="button">Aujourd’hui</button>
        </div>
      </div>
      <div id="calendar"></div>
    </section>
    <section id="print-agenda" aria-label="Agenda à imprimer"></section>
    <noscript>Activez JavaScript pour consulter l’agenda.</noscript>
  </main>
  <dialog id="event-details" aria-labelledby="event-title">
    <div class="dialog-header">
      <h2 id="event-title"></h2>
      <form method="dialog" class="dialog-close">
        <button type="submit" aria-label="Fermer les détails" autofocus>×</button>
      </form>
    </div>
    <p id="event-category"></p>
    <p id="event-date"></p>
    <p id="event-time"></p>
    <p id="event-location"></p>
    <p id="event-description"></p>
  </dialog>
  <dialog id="subscription" aria-labelledby="subscription-title">
    <div class="dialog-header">
      <h2 id="subscription-title">S’abonner à l’agenda</h2>
      <form method="dialog" class="dialog-close">
        <button type="submit" aria-label="Fermer l’abonnement" autofocus>×</button>
      </form>
    </div>
    <p><a id="google-subscription" target="_blank" rel="noopener noreferrer">Ouvrir dans Google Calendar</a></p>
    <label for="ical-address">Adresse iCal publique</label>
    <div class="ical-controls">
      <input id="ical-address" type="url" readonly>
      <button id="copy-ical" type="button">Copier</button>
    </div>
    <p id="copy-status" role="status"></p>
  </dialog>
</body>
</html>
